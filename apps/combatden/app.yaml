id: combatden
display_name: CombatDen

# The app-declared classification vocabulary: the closed set of values a
# run's output.yaml `category` may carry (the 8 parent gym-type buckets —
# mirrors ParentGymType in the FastApi backend / the CRM's showcase
# groups). A run whose category is missing or outside this set is skipped
# by GET /apps/{id}/styles. The category itself lives per-run in
# output.yaml, produced by the pipeline's classification node — it builds
# its response schema from this very list, so a value outside it can't be
# written. `expand` backfills an unclassified run; `regen --slot category`
# re-files a mis-classified one.
categories:
  - Fighting
  - Yoga
  - Pilates
  - Barre
  - HIIT
  - Cardio
  - Dance
  - Wellness

images:
  # Shared (tenant-wide)
  - id: logo_primary
    description: >-
      The gym's primary brand logo / identity mark. Lives in the persistent
      app top bar (GymHeader), shown roughly 100x100 and centred directly
      above the gym name and the info bar (which holds the rank, streak,
      points and QR items). It is present on every main tab — Home,
      Profile, Rewards, Videos — and at the top of every post-class
      celebration screen. It is the first thing the user sees on app open
      and is on screen almost constantly. Purpose: pure brand anchor and
      gym identity; it is never tied to an event or a reward. Role is calm
      and permanent, not celebratory — it must read instantly and stay
      legible at small size as a single coherent logo mark. Keep it simple
      and realistic — a clean, professional logo an actual business would
      really use as its mark, not an illustrated scene, a busy composition,
      or a rendered mascot (e.g. a wordmark, a monogram / lettermark, an
      emblem or badge mark, a simple abstract symbol — brand's choice).
  - id: rank_belt
    description: >-
      The visual token of the user's CURRENT earned rank / tier — what
      they are right now. The object is the brand's to choose: in combat
      sports a graded belt reads instantly, but interpret it as whatever
      rank token fits this brand's world (e.g. a graded belt, a tiered
      badge, a chevron/stripe rank insignia, a ranked crest — brand's
      choice). Used in three places: (1) a tiny ~39x24 indicator in the
      persistent top info bar next to the rank label; (2) ~77x50 in the
      Profile screen's rank header beside the rank name and subtitle; (3)
      the animated hero of the post-class Rank celebration screen — the 2nd
      of five post-class cards (Streak, Rank, Points, Rewards, Wins) — where
      it flies in large and centred (~280px), holds, then shrinks down into
      the profile header slot as stats fade in. So it must work both as a
      calm, tiny status indicator and as a bold, proud celebratory hero. The
      moment is achievement and earned status.

  # Page-specific
  - id: celebration_image
    description: >-
      The single hero that celebrates a successful class booking. Fills the
      ClassBookedScreen as a full-bleed centred hero (~50-60% of the
      viewport), revealed with a scale-in pop after a brief loading +
      done-check sequence, with a "Class Booked" headline directly below it
      and a Continue button at the bottom. It appears the instant the user
      commits to booking a class and is the ONLY place a booking success is
      celebrated — the first positive payoff for that action and a key
      retention moment. The emotion is peak, energetic, congratulatory
      success: "you're in, your spot is locked". Read that feeling and pick
      imagery that lands it in this brand's world (e.g. a confirmed
      ticket/pass, a checkmark seal in a burst, a locked-in calendar mark,
      raised gloves, a flag planted — brand's choice).
  - id: trophy_image
    description: >-
      The celebratory hero that headlines the end-of-session "Today's Wins"
      recap — its job is to land the feeling of victory and accomplishment,
      the reward for showing up and finishing. Read the emotion, not a fixed
      object: choose imagery that says "won / accomplished" in this brand's
      world (e.g. a trophy, a champion's belt, a medal, a laurel/crown, a
      milestone marker — brand's choice). Sits ~230x230, centred inside a
      sparkle/particle burst, on the WinsScreen — the 5th and final card of
      the post-class flow — with a "Today's Wins" headline, subtitle and
      three summary stat tiles cascading in below it. This is the closing
      high note as the user leaves the gym after their session is recapped.
  - id: points_stars_image
    description: >-
      The hero that celebrates the points earned during a session — a burst
      of earned value at the climax of the points reveal. It should echo the
      app's points unit (see single_point): build it from that same token
      rather than a generic graphic. On the PointsScreen — the 3rd post-class
      card — a kinetic 3D sphere of orbiting point tokens first collapses
      inward, and then this ~238x238 graphic is revealed centred with a "+N
      POINTS" count-up and a running total caption pinned below. It is the
      payoff at the end of the points animation: rewarding and high-energy
      (e.g. a radiant cluster, an upward cascade, or a burst of the point
      tokens — brand's choice). Must still read instantly as "points /
      earned value" and stay semi-professional — energetic, not gimmicky.
    depends_on:
      - single_point
  - id: next_rank_belt_image
    description: >-
      A preview of the NEXT rank's token — the tier the user is working
      toward, deliberately distinct from rank_belt (their current tier). Use
      the same kind of rank token rank_belt uses for this brand (e.g. a
      graded belt, a tiered badge, a chevron/stripe insignia, a ranked
      crest), but clearly one tier HIGHER and aspirational. Lives in the
      Profile screen's "Next Rank" section, inset inside a ~100x100 circular
      progress badge: an animated progress arc rings the badge and the image
      sits within it with ~22px padding, above a "Next Rank" title and an
      "X / Y classes to next tier" progress label. The moment is calm,
      between-classes browsing — motivational, not celebratory. It must read
      clearly inside a small circular badge without fighting the progress
      ring, and should clearly feel like a higher tier the user has not
      reached yet.
    depends_on:
      - rank_belt
  - id: giftbox
    description: >-
      The SOURCE of an unwrap-then-burst animation — the metaphor for an
      unclaimed reward about to be opened. It MUST read instantly (even
      mid-motion) as a single closed container that opens and releases a
      burst; the exact object is the brand's (e.g. a wrapped gift box, a
      treasure chest, a sealed prize capsule, a locker/case — brand's
      choice). On the RewardsCardScreen (4th post-class card) it flies in
      with a spin, holds briefly, then scales away as point tokens burst
      outward from its centre, after which a rewards carousel takes over. It
      is never shown statically for long — it exists to be opened. The moment
      is anticipation releasing into payoff: "you've earned something, claim
      it". Playful, kinetic, high-energy.
    depends_on:
      - single_point
  - id: single_point
    description: >-
      The app's signature points / earned-value token — the atomic
      unit of the points / rewards visual language. Three uses: (1) a ~22px
      points icon in the persistent top info bar next to the points balance;
      (2) fourteen instances forming the orbiting 3D sphere on the Points
      screen; (3) fourteen instances bursting radially out of the giftbox on
      the Rewards screen. So it is simultaneously a tiny permanent utility
      icon AND a mass-instanced motion particle: it MUST read instantly as a
      "points" unit, be simple, perfectly legible at ~22px, symmetrical, and
      look right when repeated, rotated, depth-sorted and scaled in motion —
      a single clean token, never a scene or a cluster, and kept
      semi-professional (no wild or gimmicky shapes). The object is otherwise the brand's to choose
      (e.g. a star, a coin/chip, a gem, a pip/token) as long as it
      stays an instantly-readable, restrained points unit.
  - id: icon_qrcode
    description: >-
      A QR-code graphic that signals in-gym check-in / sign-up. It is the
      right-most item of the persistent top info bar, ~30px tall and
      tappable; per the product it serves the at-the-gym check-in moment —
      scanned one-thumbed, sometimes with sweaty hands and variable gym
      lighting (the dedicated full check-in screen is not built yet, so for
      now it lives only as this top-bar entry point). Role is a calm,
      functional, navigational utility — it MUST read unmistakably as a
      scannable QR affordance at small size, never celebratory. It is a
      stylised QR-style graphic standing for "check in here", not a real
      scannable code.
  - id: streak_icon
    description: >-
      Communicates that the user has an attendance streak going. Read that feeling
      and pick imagery that fits this brand's world
      (e.g. a flame, stacked forward chevrons, a lightning bolt, or pick wtv you think would fit is encouraged).
      This should be stylized to fit their brand and feel exciting while being clear and scannable.
      Must not be inside a token, wtv you pick should be on its own.
      Used in three places: (1) ~22x30 in the persistent top info bar beside the streak
      day count; (2) ~12x15 in the Home screen's upcoming-sessions card
      footer next to "You're on an X week streak!"; (3) the ~240px icon hero
      of the post-class Streak screen (the 1st post-class card), revealed by
      the streak celebration animation as it grows in.

  # Class photography — the only SCENE slots in this app.
  #
  # Everything above is a cutout asset: an object on a flat field that the
  # background pass lifts onto transparency. These four are photographs of a
  # real place, so they set `scene: true` — different prompt rule, cheapest
  # quality tier, and no background pass (see schema/slots.py ImageSlot.scene).
  #
  # They are DELIBERATELY not tied to named classes. The gym's real schedule
  # is content the app fetches; these are the brand's own imagery of its
  # space, reused across whatever the schedule happens to hold. Four exist so
  # a schedule reads as a real week rather than the same photo repeated —
  # which is also why each asks for a different moment in the room.
  - id: class_photo_1
    description: >-
      A photograph of a class in session at this brand's own space, used as
      the thumbnail on schedule rows and as the banner on the class detail
      screen. THE ESTABLISHING SHOT of the four: the widest, showing the most
      of the room and the most people, so a member scrolling the schedule
      sees what the place actually looks like. Mid-session and busy, with
      people genuinely working rather than posed. This is the one that most
      has to look like somewhere real you could walk into.
    scene: true
    depends_on_text:
      - class_name_1
  - id: class_photo_2
    description: >-
      A second class photograph from the same space, filling the same role as
      the first on other schedule rows. Deliberately a DIFFERENT MOMENT: a
      closer, tighter view on two or three people working at whatever this
      brand's practice actually involves, so the schedule does not read as
      one photo repeated. Same room, same brand, closer in.
    scene: true
    depends_on_text:
      - class_name_2
  - id: class_photo_3
    description: >-
      A third class photograph from the same space. This one is the QUIET
      one: fewer people, a calmer beat — warming up, resting between efforts,
      an instructor showing something to one person. Same room and the same
      brand, at a lower energy than the other three, so the set spans the
      real range of a session rather than only its peak.
    scene: true
    depends_on_text:
      - class_name_3
  - id: class_photo_4
    description: >-
      A fourth class photograph from the same space. The DETAIL shot: close
      on the equipment, surfaces and kit this brand's practice actually uses,
      with people present but partly out of frame. It carries the texture and
      materials of the room more than the activity, and completes the set of
      four so a week of schedule rows never shows the same picture twice.
    scene: true

  # Reward catalogue — the points store's six items, cheapest to dearest.
  #
  # Cutout assets like everything above (`scene` stays false): each is one
  # object on a flat field, composited onto whatever card renders it.
  #
  # Named for their ROLE IN THE LADDER, never for the object CombatDen
  # happens to use, because the object is exactly what a different brand
  # must be free to change — a gym redeems gloves, a yoga studio redeems a
  # bolster, and both are the same rung. The descriptions give examples to
  # think with, and the image prompt rule already treats an "e.g." list as a
  # starting point rather than a closed set.
    depends_on_text:
      - class_name_4
  - id: reward_guest_pass
    description: >-
      The social reward and the cheapest thing in the store: bringing
      someone else along for a session. Depict the invitation as an object
      this brand would really hand over, or as two people arriving together
      (e.g. a printed guest pass, paired entry tokens, a duplicate
      membership card, a two-person motif — brand's choice). Reads as
      generous and easy to reach, being the first thing a new member can
      afford. Rendered ~150x150 on a points-store card and in the post-class
      rewards carousel.
    depends_on_text:
      - reward_name_guest_pass
  - id: reward_apparel
    description: >-
      The branded APPAREL reward — the item a member wears out of the
      building and that turns them into advertising (e.g. a t-shirt, a
      hoodie, a vest, a cap — brand's choice). It should look like real
      merchandise this business would actually print and be proud of, in the
      brand's own colours, with NO text, lettering or logo rendered on it.
      Rendered ~150x150 on a points-store card and in the post-class rewards
      carousel.
    depends_on_text:
      - reward_name_apparel
  - id: reward_gear
    description: >-
      The piece of EQUIPMENT this brand's practice actually needs — the
      aspirational kit purchase, and the one reward whose object changes
      most between brands (e.g. gloves for a fight gym, a mat for a yoga
      studio, a reformer strap for pilates, a jump rope for conditioning —
      read the brand and pick what its members would genuinely want). Show
      it as real gear with materials and finish that read as a quality
      item, not a generic icon. Rendered ~150x150 on a points-store card and
      in the post-class rewards carousel.
    depends_on_text:
      - reward_name_gear
  - id: reward_session
    description: >-
      A one-to-one session with a coach or instructor — the dearest reward
      and the thing points are saved up for. The subject is the session, so
      depict what stands for personal instruction in this brand's world
      (e.g. focus mitts, a single mat set out with a teacher's props, a
      stopwatch and clipboard, a one-on-one motif — brand's choice) rather
      than a literal portrait of two people. Reads as attentive, personal
      and the top of the ladder. Rendered ~150x150 on a points-store card
      and in the post-class rewards carousel.

  # Video thumbnails — the Videos tab's card art.
  #
  # SCENE slots like the class photography, and for the same reason: a
  # thumbnail is a frame of footage, not an object on a flat field, so the
  # cutout contract and its background pass would destroy it.
  #
  # Four, cycled across however long the feed is (`slotAt` in the mockups'
  # showcaseSlots.ts), which is the same arrangement the four class photos
  # use. A feed is however many cards the platform serves and a slot per card
  # is not a thing an app manifest can declare; four is what makes a scrolling
  # feed stop reading as one repeated picture, which is the same bar the
  # schedule had to clear.
  #
  # WORTH KNOWING: in the real member app this shelf is THIRD-PARTY content —
  # the thumbnails belong to the channels whose videos they are. Generating
  # them is right for the mock, whose job is to show a brand's world end to
  # end with nothing borrowed, and it is the reason each description asks for
  # the brand's own practice rather than for a video about it.
    depends_on_text:
      - reward_name_session
  - id: video_thumb_1
    description: >-
      The HERO thumbnail at the top of the Videos tab — the largest piece of
      video art in the app, rendered full-width above a Play button. A single
      striking frame of this brand's practice being done well: one subject,
      clear silhouette, enough space around them to survive a title being laid
      over it. Reads as the most watchable thing on the shelf, because that is
      the slot it occupies.
    scene: true
    depends_on_text:
      - video_title_1
  - id: video_thumb_2
    description: >-
      A carousel thumbnail, rendered ~160x90 in a horizontally scrolling row.
      An INSTRUCTIONAL frame: someone demonstrating a technique or position
      close enough that the detail reads at thumbnail size. Small format is
      the constraint that matters — one clear subject filling the frame, no
      wide room shots, nothing that turns to mush at 160px.
    scene: true
    depends_on_text:
      - video_title_2
  - id: video_thumb_3
    description: >-
      A second carousel thumbnail, same ~160x90 format, deliberately a
      different energy from the others: the EFFORT frame — mid-work, sweat,
      motion, a moment of real exertion in this brand's practice. It is what
      stops a row of cards reading as one shoot, so it should look like a
      different day than the second thumbnail.
    scene: true
    depends_on_text:
      - video_title_3
  - id: video_thumb_4
    description: >-
      A third carousel thumbnail at ~160x90, the CALM one: talking to camera,
      a coach explaining something, a considered moment away from the work
      itself. Completes a set of four with enough range that a long feed
      cycling through them never shows the same picture twice in a row.
    scene: true
    depends_on_text:
      - video_title_4
colors:
  - id: primary
    description: Dominant brand color. Used for primary CTAs and key accents.
  - id: background
    description: App background color. Usually dark for a gym aesthetic.
    role: background
  - id: text
    description: Main text color for headings and body copy.
    role: text
  - id: accent
    description: Selection / active-state highlight. MUST be a visibly distinct
      hue from `primary` (a different hue family, not a tint or clone of it),
      premium and coherent on the dark gym canvas, and meet WCAG AA against the
      background. Drives the active nav item, active timeframe pill, and active
      tab — used as borders / one active label, never a fill.

fonts:
  - id: display
    description: >-
      Headline / hero / celebration typography — the "Class Booked"
      title, post-class card titles (Streak / Rank / Points / Rewards /
      Wins), points count-ups, and screen titles. Used at large sizes
      (24–64px) and short bursts. Must carry the brand's athletic
      energy and feel distinctive at a glance — confident, modern,
      premium. Numerals must read cleanly because every celebration
      screen pairs the title with a big number.
  - id: body
    description: >-
      All running UI text — buttons, list rows, info-bar labels (rank /
      streak / points), stat tiles, body copy. Used at 13–18px in long
      sessions on a dark canvas. Must be highly legible at small sizes,
      have a generous x-height, hold up at every weight from regular to
      bold, and feel visually quiet so the display font and the
      accents lead. Numerals must be tabular-friendly because the info
      bar stacks several side-by-side counters.

texts:
  - id: class_booked_headline
    description: >-
      The full-bleed celebration headline shown the moment a class
      booking succeeds. Sits directly below the celebration hero on
      ClassBookedScreen, ~36–48px display weight. The single high
      point of the booking flow — the user just committed, this is
      their first positive payoff. Should land like the brand
      cheering — combative gyms read like a fighter locking in,
      grappling academies like stepping on the mat, premium studios
      like a calm confirmation. Title-case or sentence case; never
      ALL CAPS unless the brand demands it.
    min_words: 1
    max_words: 3
    min_chars: 4
    max_chars: 22
  - id: reserve_cta
    description: >-
      The primary booking button on a class detail / reservation
      screen — the action that commits the user to attend. Reads as
      a verb phrase in the brand's voice (combat gym: "Lock it in.";
      grappling academy: "Claim your mat."; calmer studio: "Reserve
      a spot."). Has to fit a single-line pill button without
      wrapping. Imperative, present tense, no trailing period unless
      the brand reads punchy with one.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 22
  - id: wins_title
    description: >-
      The headline of the post-class "wins" recap screen — the 5th
      and final post-class card. Pairs with a sparkle / trophy hero
      and three summary stat tiles. The closing high note of the
      session: it should celebrate the user's effort in the brand's
      voice without being saccharine. Combat-leaning brands lean
      punchy ("Today's wins"); calmer brands lean reflective
      ("Today's progress"). Short, declarative, never a full
      sentence.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 20
  - id: wins_subtitle
    description: >-
      The one-line subtitle directly under the wins headline on the
      same end-of-session recap screen. This is the single chattiest
      line of brand voice in the app — a short motivational beat
      that pushes the user back into the next session. Combat gyms
      read aggressive ("The grind never stops"), BJJ academies more
      technique-led ("Every roll sharpens you"), premium studios
      calm ("Each session counts"). One short clause; no exclamation
      mark unless the brand genuinely shouts.
    min_words: 2
    max_words: 6
    min_chars: 8
    max_chars: 40
  - id: book_next_class_cta
    description: >-
      The CTA at the bottom of the post-class wins recap that takes
      the user back into the booking flow for their next session.
      Same button shape as ``reserve_cta`` but the moment is
      different — the user just finished training and is being
      nudged to commit again. Should read like the brand inviting
      them back, not pleading. Imperative, verb-led, no trailing
      period.
    min_words: 2
    max_words: 5
    min_chars: 8
    max_chars: 28

  # ---- The named inventory: classes, rewards and videos ----
  #
  # These twelve are what the four class photos, the four reward products and
  # the four video thumbnails are pictures OF. Each image slot names its own
  # via `depends_on_text`, so the run resolves the name first and the picture
  # is generated to match it (schema/slots.py, ImageSlot.depends_on_text).
  #
  # THEY COST NOTHING EXTRA. The text module is atomic — one call resolves the
  # whole inventory — so going from five slots to seventeen is more tokens in
  # one request, not twelve more requests. It is also what makes each SET
  # internally coherent for free: the model writes all four reward names in
  # one breath, so it can build a ladder rather than four unrelated items.
  #
  # Every one of these is an OVERRIDE of content the app otherwise fetches or
  # ships. The member app falls back to its own strings for any slot a run
  # does not carry, which is why none of them is load-bearing on its own.
  - id: class_name_1
    description: >-
      The name of this brand's flagship class — the one a newcomer is
      steered to and the one the schedule leads with. Reads like something
      printed on a real timetable, not a marketing phrase: a fight gym's
      might be "Boxing Fundamentals", a yoga studio's "Morning Flow". Names
      the practice plainly enough that someone who has never trained here
      knows what they would be doing. Title case.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 30
  - id: class_name_2
    description: >-
      A second class on the same timetable, and a DIFFERENT KIND of session
      from the first — where the first is the flagship, this is the harder or
      more advanced one that regulars come for. Same brand, same room, same
      naming convention, so the two read as two lines of one schedule.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 30
  - id: class_name_3
    description: >-
      A third class, the GENTLE one on the timetable: recovery, technique,
      mobility, a beginner's session — whatever this brand's low-intensity
      offering actually is. It is what makes the schedule read as a real week
      with a range of energies rather than four versions of the same class.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 30
  - id: class_name_4
    description: >-
      A fourth class rounding out the week — this brand's specialist or
      signature session, the one that is distinctly theirs rather than
      something every gym in the category runs. Completes a timetable of four
      that a member could plausibly plan a week around.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 30
  - id: reward_name_guest_pass
    description: >-
      What this brand CALLS the social reward — bringing someone along for a
      session, the cheapest thing in the points store. Named the way it would
      appear on a real store card ("Bring a Friend", "Guest Day Pass"), in
      this brand's voice. It sits in a four-rung ladder with the three reward
      names below and should read as the entry rung of it.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 24
  - id: reward_name_apparel
    description: >-
      What this brand calls its APPAREL reward — the item a member wears out
      of the building. Names the garment this brand would actually print
      ("Team Tee", "Studio Hoodie"). Second rung of the same four-name
      ladder, so it should read as a step up from the guest pass and a step
      below the gear.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 24
  - id: reward_name_gear
    description: >-
      What this brand calls its EQUIPMENT reward — the aspirational kit
      purchase, and the name that varies most between brands because the
      object does (gloves, a mat, a rope, a strap). This is the name the
      generated product image is drawn from, so it should name a specific
      thing rather than gesture at a category. Third rung of the ladder.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 24
  - id: reward_name_session
    description: >-
      What this brand calls its one-to-one coaching reward — the dearest item
      in the store and the top rung of the ladder. Names personal instruction
      in this brand's own words ("Private Session", "1:1 Coaching"). Should
      read as clearly the most valuable of the four.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 24
  # The video titles are the widest bounds in this file (16 words / 85 chars)
  # and that is measured, not generous: the real shelf these seed from runs to
  # exactly that ("The Fastest Way To Blow Up Your Bench Press (4 Science-Based
  # Steps) + Sample Program"). A ceiling is not a target — the descriptions do
  # the steering — but a ceiling narrower than the real content would make the
  # seeded shelf and the generated one lay out differently, which is the one
  # thing a prefilled slot must not do.
  - id: video_title_1
    description: >-
      The title of the FEATURED video at the top of the Videos tab, rendered
      over the hero thumbnail. Reads like a real video someone would click:
      concrete, specific, promising one thing. This brand's practice, at the
      level a newcomer or a regular would search for. No clickbait
      punctuation, no all-caps, no channel name.
    min_words: 3
    max_words: 16
    min_chars: 12
    max_chars: 85
  - id: video_title_2
    description: >-
      A second video title, in the carousel below the hero — the INSTRUCTIONAL
      one. Names a technique, a drill or a position in this brand's practice
      and what watching it gets you. Same voice as the featured title so the
      shelf reads as one library.
    min_words: 3
    max_words: 16
    min_chars: 12
    max_chars: 85
  - id: video_title_3
    description: >-
      A third video title — the WORKOUT or follow-along one: a session a
      member could put on and do. Names the duration or the intensity the way
      a real fitness video does, in this brand's discipline.
    min_words: 3
    max_words: 16
    min_chars: 12
    max_chars: 85
  - id: video_title_4
    description: >-
      A fourth video title — the EXPLAINER: the piece about why this brand
      trains the way it does, a coach talking through an idea, or the mistake
      everyone makes. Rounds out a four-title shelf that spans instruction,
      practice and thinking.
    min_words: 3
    max_words: 16
    min_chars: 12
    max_chars: 85

# The persistent bottom-nav tab icons — the most repeated, brand-defining
# glyphs in the member app (present on Home, Rank/Profile, Rewards and
# Videos). Monochrome; the MobileApp tints them per theme (active = accent,
# inactive = muted text), so no colour belongs here. Each falls back to a
# Material Symbol in the app if the pipeline doesn't supply one.
icons:
  - id: nav_home
    description: >-
      The Home tab icon in the persistent bottom navigation bar — the first,
      left-most tab and the app's default landing destination (upcoming
      sessions, the day's schedule). It MUST read as "home" at ~24px (e.g. a
      house, a roof + door, a dashboard grid — brand's choice). Calm,
      functional and permanent, never celebratory; must stay sharp and
      unambiguous when small and when shown in both an active (highlighted)
      and inactive (muted) state.
  - id: nav_rank
    description: >-
      The Rank tab icon in the persistent bottom navigation bar — opens the
      profile / rank screen where the user sees their current rank tier,
      rating graph and progress to the next rank. It MUST read as achievement
      / rank / earned status at ~24px (e.g. a medal, badge, crest, chevron
      tier, ranking mark — brand's choice), matching the gym's progression
      theme. Permanent navigation utility, not a celebration; legible and
      clear in both active and inactive states.
  - id: nav_reward
    description: >-
      The Reward tab icon in the persistent bottom navigation bar — opens the
      points store / rewards area where earned points are redeemed. It MUST
      read as a reward / something earned-and-claimable at ~24px (e.g. a gift,
      a present, a token, a prize tag, treasure — brand's choice), tying into
      the app's points-and-rewards language. A calm, functional navigation
      affordance; clear and sharp in active and inactive states.
  - id: nav_videos
    description: >-
      The Videos tab icon in the persistent bottom navigation bar — opens the
      technique / level-up video library. It MUST read as "play / watch
      videos" at ~24px (e.g. a play triangle, a film/clapper, a media tile —
      brand's choice). Functional navigation, never celebratory; must stay
      legible and obvious at small size in both active and inactive states.
