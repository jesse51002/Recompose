# The café mockup — the LAYOUT half of a design.
#
# A design in this product is two artifacts that are produced separately and
# have to be readable separately:
#
#   the ASSETS  — a pipeline run: apps/<app>/<run>/customization.yaml (the
#                 brief) + output.yaml (the resolved palette, type, imagery
#                 and copy). Already self-describing.
#   the LAYOUT  — this folder: the screens an agent rewrote. Until this file
#                 there was nothing recording what it is or what produced it,
#                 so a mockup could only be understood by reading its source.
#
# This is that record. It is the mockup's counterpart to `customization.yaml`:
# the spec the layout was generated from, the design it belongs to, and the
# inventory of what it contains.

id: cafe
label: Café

# The design this layout was made for. A demo pairs ONE layout with ONE
# theme, and nothing in the code says which — the mockup renders whatever
# theme is loaded, so without this the pairing lives only in someone's head.
design:
  name: Café
  # Empty because this layout was authored, not generated against a brand. A
  # generated one names the run it was redesigned for.
  run_id: ""

# The spec the layout was produced from — the mockup's analogue of a brief.
spec:
  origin: authored
  short_desc: >-
    A café ordering flow: scan today's menu, open an item, add it to the order
    and place it.
  long_desc: >-
    Built as the SECOND app, to make "a new app is a folder" a fact rather
    than a claim. Adding it changed src/kit/ not at all and
    src/apps/combatden/ not at all.

    Deliberately shares nothing with CombatDen but the mechanism. Its own
    token vocabulary (--cafe-*), its own device size, a two-column menu grid
    where CombatDen has a vertical schedule list, and its own state. What it
    shares is defineMockAsset, defineMockApp, useMockNav, MockAssetStage and
    the recompose-react resolvers.

    It is not a pipeline app: there is no apps/cafe/app.yaml in the engine, so
    it resolves only the slot ids every brand manifest declares — the four
    colour roles and the two font roles. It carries no bundled art either;
    every picture is drawn in CSS from the palette, because with no image
    slots to resolve, a stock photograph would look themed while being the one
    element on screen that never moves.

# Every asset, matching what `defineMockApp` declares. The two must agree —
# `__tests__/mockupYaml.test.ts` fails if they drift.
assets:
  - id: order
    label: Order
    width: 402
    height: 874
    initial_route: menu
    routes:
      - menu
      - item
      - order

# What a redesign of this layout may not change. The arrangement-only
# invariant, spelled per app so it is checkable rather than aspirational.
invariants:
  - Every screen carries a way off it; the last screen of a flow returns to
    that flow's root.
  - No screen is added, removed, merged or split.
  - No feature is added and none removed — arrangement only.
  - No data fetching, ever.
