# The LAYOUT half of a design.
#
# A design is two artifacts made separately: the ASSETS (a pipeline run — its
# `customization.yaml` brief and the `output.yaml` it resolved to) and the
# LAYOUT (this folder). The theme half has always been self-describing; this
# is the layout's equivalent, and it is deliberately the same three fields as
# a brief's `design_direction`, because it answers the same question.
#
# Three fields. Nothing about routes, sizes or assets — the code already says
# all of that, and a second copy would only be a thing to keep in sync.

name: CombatDen

short_desc: >-
  The base layout: the class-based-gym member app, ported from production and
  stripped of every feature. What every redesign forks from.

long_desc: >-
  A feature-free port of the production Flutter member app — no business
  logic, no API calls, no fetching. Two assets: the app you click through
  (schedule, class, booking, store, videos, profile) and the five-card
  post-class celebration that no tap can reach.

  This is the reference implementation and the eval bed — the app the pipeline
  generates against, and the surface a design agent rewrites. It is
  deliberately CombatDen's own design language rather than a neutral one: a
  redesign has to be judged against something a real business actually ships,
  not against a blank.

  It belongs to no run. Every other layout in this package is a fork of it,
  named for the design it was redesigned against.
