# The CombatDen mockup — the LAYOUT half of a design.
#
# A design in this product is two artifacts that are produced separately and
# have to be readable separately:
#
#   the ASSETS  — a pipeline run: apps/<app>/<run>/customization.yaml (the
#                 brief) + output.yaml (the resolved palette, type, imagery
#                 and copy). Already self-describing.
#   the LAYOUT  — this folder: the screens an agent rewrote. Until this file
#                 there was nothing recording what it is or what produced it,
#                 so a mockup could only be understood by reading its source.
#
# This is that record. It is the mockup's counterpart to `customization.yaml`:
# the spec the layout was generated from, the design it belongs to, and the
# inventory of what it contains.

id: combatden
label: CombatDen

design:
  name: CombatDen
  # The BASE layout — ported from production, not redesigned against a brand.
  # A generated layout names the run it was redesigned for; this one is what
  # every redesign starts from.
  run_id: ""

spec:
  origin: ported
  short_desc: >-
    The class-based-gym member app: browse the schedule, open a class, reserve
    it, move between home, profile, store and videos — plus the five-card
    post-class celebration.
  long_desc: >-
    A port of the production Flutter app at /var/home/jm/Documents/CombatDen
    (MobileApp/ and the CRM's showcase clones), feature-free: no business
    logic, no API calls, no fetching. Every file names the Dart file it ports
    from in its header.

    It is the reference implementation and the eval bed — the app the pipeline
    generates against and the surface a design agent rewrites. Its content is
    per-gym-type constants keyed by the run's `category`, which the surface
    reads off the loaded theme, so the half of the screen that is not
    generated still follows the design.

assets:
  - id: app
    label: App
    width: 390
    height: 844
    initial_route: home
    routes:
      - home
      - class
      - booking
      - store
      - video
      - profile
  # A SECOND asset is justified only by a screen no tap can reach. The
  # post-class flow plays after a member attends a class and no button in the
  # app leads to it; that is the whole justification.
  - id: celebration
    label: Celebration
    width: 390
    height: 844
    initial_route: streak
    routes:
      - streak
      - rank
      - points
      - rewards
      - wins

invariants:
  - Every screen carries a way off it; the last screen of a flow returns to
    that flow's root.
  - No screen is added, removed, merged or split.
  - No feature is added and none removed — arrangement only.
  - No data fetching, ever.
  - The nav tabs stay named for concepts (`rank` is the profile, `reward` is
    the store) — renaming them to match the screens breaks icon resolution.
